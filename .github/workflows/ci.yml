name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check for syntax errors
        run: |
          find . -name "*.js" -not -path "./node_modules/*" | xargs -I{} node --check {}
      - name: Validate HTML
        run: |
          npx html-validate "*.html" --config '{"extends":["html-validate:standard"],"rules":{"no-trailing-whitespace":"off","attr-quotes":"off"}}' || true
